plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.roxstar'
version = '1.0.0'

android {
  namespace 'com.roxstar.app'

  defaultConfig {
    versionCode 1
    versionName '1.0.0'

    externalNativeBuild {
      cmake {
        arguments '-DANDROID_STL=c++_shared'
      }
    }
  }

  buildFeatures {
    prefab true
  }

  externalNativeBuild {
    cmake {
      path file('src/main/cpp/CMakeLists.txt')
    }
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.google.oboe:oboe:1.9.3'
}